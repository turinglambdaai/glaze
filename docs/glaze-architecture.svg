<svg xmlns="http://www.w3.org/2000/svg" width="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Glaze architecture and dependency direction</title>
  <desc id="desc">Applications use curated public modules, which call the runtime kernel. The kernel uses native platform adapters in production and an HTTP adapter in development. Keel supplies neutral contracts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a4a4a"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a1a1a; }
      .heading { font-size: 22px; font-weight: 600; }
      .section { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .note { font-size: 11px; fill: #6a6a6a; }
      .frame { stroke: #4a4a4a; stroke-width: 1.5; rx: 12; }
      .box { stroke: #4a4a4a; stroke-width: 1.5; rx: 8; }
      .wire { fill: none; stroke: #4a4a4a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="650" fill="#f8f6f3"/>
  <rect x="20" y="20" width="8" height="28" rx="4" fill="#d97757"/>
  <text x="42" y="42" class="heading">Glaze: governed architecture</text>

  <rect class="frame" x="300" y="70" width="400" height="70" fill="#a8c5e6"/>
  <text x="500" y="99" text-anchor="middle" class="section">Application</text>
  <text x="500" y="122" text-anchor="middle" class="body">HackDigest · generated apps · tests and agents</text>

  <path class="wire" d="M500,140 L500,180"/>

  <rect class="frame" x="60" y="180" width="880" height="120" fill="#e8e6e3"/>
  <text x="80" y="206" class="section">Reviewed public modules</text>
  <rect class="box" x="90" y="225" width="140" height="50" fill="#a8c5e6"/>
  <text x="160" y="255" text-anchor="middle" class="body">glaze/core</text>
  <rect class="box" x="260" y="225" width="140" height="50" fill="#a8c5e6"/>
  <text x="330" y="255" text-anchor="middle" class="body">window</text>
  <rect class="box" x="430" y="225" width="140" height="50" fill="#9dd4c7"/>
  <text x="500" y="255" text-anchor="middle" class="body">services</text>
  <rect class="box" x="600" y="225" width="140" height="50" fill="#f4e4c1"/>
  <text x="670" y="255" text-anchor="middle" class="body">distribution</text>
  <rect class="box" x="770" y="225" width="140" height="50" fill="#f4e4c1"/>
  <text x="840" y="255" text-anchor="middle" class="body">devtools</text>

  <path class="wire" d="M500,300 L500,350"/>

  <rect class="frame" x="110" y="350" width="700" height="120" fill="#9dd4c7"/>
  <text x="130" y="376" class="section">Runtime kernel</text>
  <rect class="box" x="140" y="395" width="180" height="50" fill="#f8f6f3"/>
  <text x="230" y="416" text-anchor="middle" class="body">Lifecycle + ownership</text>
  <text x="230" y="434" text-anchor="middle" class="note">custodian · app state</text>
  <rect class="box" x="370" y="395" width="180" height="50" fill="#f8f6f3"/>
  <text x="460" y="416" text-anchor="middle" class="body">GLZ1 + schema</text>
  <text x="460" y="434" text-anchor="middle" class="note">invoke · stream · event</text>
  <rect class="box" x="600" y="395" width="180" height="50" fill="#f8f6f3"/>
  <text x="690" y="416" text-anchor="middle" class="body">Capability authority</text>
  <text x="690" y="434" text-anchor="middle" class="note">per-window · default deny</text>

  <rect class="box" x="850" y="370" width="110" height="80" fill="#f4e4c1"/>
  <text x="905" y="403" text-anchor="middle" class="section">Keel</text>
  <text x="905" y="423" text-anchor="middle" class="note">neutral contracts</text>
  <path class="wire" d="M850,410 L810,410"/>

  <path class="wire" d="M230,470 L230,525"/>
  <path class="wire" d="M460,470 L460,525"/>
  <path class="wire" d="M690,470 L690,525"/>

  <rect class="frame" x="60" y="525" width="880" height="95" fill="#f4e4c1"/>
  <text x="80" y="551" class="section">Carriers and platform adapters</text>
  <rect class="box" x="100" y="565" width="260" height="36" fill="#a8c5e6"/>
  <text x="230" y="588" text-anchor="middle" class="body">WebView2 · WKWebView · WebKitGTK</text>
  <rect class="box" x="385" y="565" width="150" height="36" fill="#a8c5e6"/>
  <text x="460" y="588" text-anchor="middle" class="body">Native transport</text>
  <rect class="box" x="585" y="565" width="210" height="36" fill="#e8e6e3"/>
  <text x="690" y="588" text-anchor="middle" class="body">HTTP/SSE dev adapter</text>

  <text x="500" y="640" text-anchor="middle" class="note">Dependency direction is downward; carriers share one dispatch contract.</text>
</svg>
