name: Performance Baseline

# Informational, non-blocking measurements run weekly or manually.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    # G4-S2: record one informational performance baseline per platform and
    # revision. Values carry NO pass/fail thresholds (docs/benchmarks.md) —
    # shared-runner variance must not reject a pull request.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macOS-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: '9.3'

      - name: Install Glaze package
        shell: bash
        run: raco pkg install --auto --no-docs --link "$PWD"

      - name: Record framework baseline
        shell: bash
        run: |
          racket scripts/measure-baseline.rkt --json > baseline-${{ runner.os }}.json
          cat baseline-${{ runner.os }}.json

      - name: Upload baseline report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ runner.os }}
          path: baseline-*.json
          if-no-files-found: error
