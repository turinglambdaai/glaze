<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Counter · Glaze</title>
  <style>
    body{font-family:-apple-system,sans-serif;background:#F4F3EE;color:#2d2a26;
         display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{text-align:center}
    #count{font-size:96px;font-weight:800;color:#C15F3C;margin:12px 0}
    button{background:#C15F3C;color:#fff;border:none;border-radius:10px;
           padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;margin:0 6px}
    button.secondary{background:#d8d4c8;color:#2d2a26}
    #history{color:#6b675f;font-size:15px;min-height:22px;margin-top:18px}
    .hint{margin-top:26px;font-size:12px;color:#9a958a}
    #live{font-size:13px;color:#7da37a;min-height:18px}
  </style>
</head>
<body>
<div class="card">
  <div style="font-size:14px;color:#6b675f">Racket 侧状态 · 宏路由 + 事件推送</div>
  <div id="count">–</div>
  <div id="live"></div>
  <button onclick="glaze.api.counterBump({delta:1})">+1</button>
  <button onclick="glaze.api.counterBump({delta:5})">+5</button>
  <button class="secondary" onclick="glaze.api.counterReset()">重置</button>
  <div id="history"></div>
  <div class="hint">define-api-routes 生成的 glaze.api.* · bus-broadcast! 经 SSE 驱动本页更新</div>
</div>
<script src="/glaze/api.js"></script>
<script>
  glaze.on('count-changed', s => {
    document.getElementById('count').textContent = s.count;
    document.getElementById('history').textContent =
      s.history.length ? '历史: ' + s.history.join(' · ') : '';
  });
  glaze.api.counter().then(s => {
    document.getElementById('count').textContent = s.count;
    document.getElementById('live').textContent = '● 已连接 Racket 事件流';
  });
</script>
</body>
</html>
